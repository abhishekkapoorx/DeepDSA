
services:
  # Frontend Next.js service (development)
  frontend:
    build:
      context: ./main-fb
      dockerfile: Dockerfile.dev
    container_name: deepdsa-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - MONGO_URI=${MONGO_URI:-}
      - JUDGE0_API_URL=${JUDGE0_API_URL:-}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
      - JUDGE0_API_HOST=${JUDGE0_API_HOST:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-nano}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
    env_file:
      - ./main-fb/.env
    networks:
      - deepdsa-network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./main-fb/src
          target: /app/src
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./main-fb/public
          target: /app/public
        - action: rebuild
          path: ./main-fb/package.json
        - action: sync
          path: ./main-fb/package-lock.json
          target: /app/package-lock.json
        - action: sync
          path: ./main-fb/next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: ./main-fb/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./main-fb/postcss.config.mjs
          target: /app/postcss.config.mjs
    command: npm run dev

  # Ngrok for all tunnels (single agent session)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: deepdsa-ngrok
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    env_file:
      - ./.env
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    command: start --all --config=/etc/ngrok.yml --authtoken=${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
    networks:
      - deepdsa-network
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  next_cache:
    driver: local

networks:
  deepdsa-network:
    driver: bridge